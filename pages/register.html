<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>
      Nest Finder
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Jersey+25&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel= "stylesheet" href="../css/style.css">
  </head>
  <body>
    <header class="navbar">
      <div class="navbar-logo">
        <a href="homepage.html"><img src="../icons/NestFinder.png" alt="NestFinder Logo"></a>
      </div>

      <div class="navbar-icons">
        <img src="../icons/Bell.png" alt="Notification" class="navbar-icon">
        <img src="../icons/user-icon.png" alt="User Profile" class="navbar-icon">
      </div>
    </header>

    <div class="image-container">
      <img src="../images/apartment-view.png" class="apartment-view">
      <div class="nest-finder-overlaid">Join NestFinder</div>
    </div>
    <div class="login-container">
      <div class="form-box">
        <form onsubmit="return handleRegister(event)">
          <div class="fields-area">
            <p class="heading">Register</p>
            <p class="sub-title-login">Create an account to stay updated on the latest housing listings near UBC.</p>
            <input type="text" class="field" id="email" name="email" placeholder="Email">
            <input type="password" class="field" id="password" name="password" placeholder="Password">
            <input type="password" class="field" id="confirm-password" name="confirm-password" placeholder="Confirm Password">
            <a class="forgot-password-link" href="login.html"><p class="forgot-password">Already have an account? Log in!</p></a>
          </div>
          <button type="submit" class="submit-button">Register</button>
        </form>
      </div>
    </div>


    <footer class="footer">
      <div class="footer-content">
        <div class="footer-text">
          <h1>NestFinder</h1>
          <p>Follow us to stay updated on upcoming events and changes!</p>
        </div>
        <div class="footer-icons">
          <a href="https://portal.nwplus.io" target="_blank"><img src="../icons/linkedin-footer.png" alt="LinkedIn Icon" class="social-footer"></a>
          <a href="https://portal.nwplus.io" target="_blank"><img src="../icons/facebook-footer.png" alt="Facebook Icon" class="social-footer"></a>
          <a href="https://portal.nwplus.io" target="_blank"><img src="../icons/tiktok-footer.png" alt="TikTok Icon" class="social-footer"></a>
          <a href="https://portal.nwplus.io" target="_blank"><img src="../icons/instagram-footer.png" alt="Instagram Icon" class="social-footer"></a>
        </div>
      </div>
    </footer>

    <script src="../js/auth.js"></script>
    <script src="../js/navbar-auth.js"></script>
    <script>
        function handleRegister(event) {
            event.preventDefault();

            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm-password").value;

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return false;
            }

            var result = Auth.register(email, password);
            if (!result.ok) {
                alert(result.error);
                return false;
            }

            // Automatically sign the new user in, then send them to browsing.
            Auth.login(email, password);
            alert("Account created! Welcome to NestFinder.");
            window.location.assign("browsepage.html");
            return false;
        }
    </script>
  </body>
</html>
